; PlatformIO Project Configuration File
;
; Para trocar o modelo: edite include/model_config.h
; Mude ACTIVE_MODEL para MODEL_TCN_INT8 / FLOAT16 / FLOAT32

[platformio]

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 115200
upload_port = /dev/ttyUSB0
monitor_port = /dev/ttyUSB0
upload_flags =
    --before=no_reset
    --after=hard_reset
    --connect-attempts=10

; Particao maior: necessaria para o binario com TFLite (~3 MB de app)
board_build.partitions = huge_app.csv

; TensorFlow Lite Micro (port oficial para Arduino)
; ArduinoJson: parse do JSON retornado por /ota/latest
lib_deps =
    https://github.com/tensorflow/tflite-micro-arduino-examples
    bblanchon/ArduinoJson@^7.0.0

lib_ldf_mode = deep+

build_flags =
    -DTF_LITE_STATIC_MEMORY
    -fno-exceptions
    -Wno-error=narrowing
    -Wno-narrowing
    -Os

; TFLite Micro estoura RAM se o PlatformIO usar todos os nucleos.
; Compile com: pio run -j1
; Alternativa permanente no terminal/VS Code: PLATFORMIO_RUN_JOBS=1

; Pre-build: cria junctions, stub version.h e remove peripherals/ do Nano 33 BLE
extra_scripts =
    pre:scripts/fix_tflm.py
