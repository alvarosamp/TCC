[tool:pytest]
testpaths = src/tests
addopts = --cov=src --cov-report=term-missing

[coverage:run]
omit =
    # Scripts de orquestracao e CLI
    src/training/train_all.py
    src/training/hpo.py
    # Dependem de TensorFlow/TFLite
    src/training/neural_models.py
    src/export/export_tflite.py
    # Adaptadores de hardware/dados reais
    src/data/adapters/seismic_edge.py
    src/data/validate_dataset.py
    # Exportacao para C (dependencia externa)
    src/export/export_header.py
    # Configuracoes de ambiente
    src/core/settings.py
    # Arquivo de teste nao coletado (nome sem test_)
    src/tests/teste_redes_neurais.py

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise NotImplementedError
