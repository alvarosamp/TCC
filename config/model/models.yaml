        spatial_dropout:
          type: float
          low: 0.0
          high: 0.30
        learning_rate:
          type: float
          low: 0.0001
          high: 0.005
          log: true
        l2_reg:
          type: float
          low: 0.0000001
          high: 0.001
          log: true
        pos_multiplier:
          type: float
          low: 0.70
          high: 2.00
        label_smoothing:
          type: float
          low: 0.0
          high: 0.05
        batch_size:
          type: categorical
          choices: [128, 256, 512]
        head_pooling:
          type: categorical
          choices: [avg]
        conv_type:
          type: categorical
          choices: [conv, separable]
