  lstm_classifier:
    enabled: false
    family: neural_classifier
    deployment_target: server
    selection_group: overall
    edge_candidate: false
    export_tflite: false
    priority: sequence_baseline
    params:
      units: 48
      dense_units: 24
      dropout: 0.20
      epochs: 40
      batch_size: 256
