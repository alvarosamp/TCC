# Catalogo de modelos do pipeline generico.
#
# enabled:
#   true  -> entra no pipeline
#   false -> fica documentado, mas nao roda por padrao
#
# tune.enabled:
#   true  -> roda Optuna antes do treino final
#   false -> usa params fixos
#
# edge_candidate:
#   true  -> pode virar candidato TinyML/ESP32
#   false -> baseline, interpretabilidade ou comparacao cientifica

selection:
  metric: auc_pr
  split: test
  mode: maximize

models:
  logistic_regression:
    enabled: true
    family: classical_supervised
    edge_candidate: false
    export_tflite: false
    priority: baseline_light
    params:
      class_weight: balanced
      max_iter: 2000
      C: 1.0
    tune:
      enabled: false
      n_trials: 20
      search_space:
        C:
          type: float
          low: 0.001
          high: 10.0
          log: true

  random_forest:
    enabled: true
    family: classical_supervised
    edge_candidate: false
    export_tflite: false
    priority: interpretable_baseline
    params:
      n_estimators: 100
      max_depth: null
      min_samples_split: 2
      min_samples_leaf: 1
      class_weight: balanced
      n_jobs: -1
    tune:
      enabled: false
      n_trials: 30
      search_space:
        n_estimators:
          type: int
          low: 150
          high: 600
        max_depth:
          type: categorical
          choices: [null, 8, 12, 16, 24, 32]
        min_samples_leaf:
          type: int
          low: 1
          high: 5

  extra_trees:
    enabled: false
    family: classical_supervised
    edge_candidate: false
    export_tflite: false
    priority: interpretable_baseline
    params:
      n_estimators: 300
      max_depth: null
      min_samples_split: 2
      min_samples_leaf: 1
      class_weight: balanced
      n_jobs: -1
    tune:
      enabled: true
      n_trials: 30
      search_space:
        n_estimators:
          type: int
          low: 150
          high: 600
        max_depth:
          type: categorical
          choices: [null, 8, 12, 16, 24, 32]
        min_samples_leaf:
          type: int
          low: 1
          high: 5

  isolation_forest:
    enabled: false
    family: classical_unsupervised
    edge_candidate: false
    export_tflite: false
    priority: anomaly_baseline
    params:
      n_estimators: 300
      contamination: 0.05
      n_jobs: -1
    tune:
      enabled: true
      n_trials: 20
      search_space:
        n_estimators:
          type: int
          low: 150
          high: 600
        contamination:
          type: float
          low: 0.01
          high: 0.20
          log: false

  # Mantidos como experimentos. Nos resultados atuais, os autoencoders ficaram
  # bem abaixo dos classificadores supervisionados e geraram muitos falsos positivos.
  dense_autoencoder:
    enabled: false
    family: autoencoder
    edge_candidate: true
    export_tflite: true
    priority: experimental
    params:
      hidden_units: [256, 128]
      latent_dim: 32
      dropout: 0.10
      epochs: 40
      batch_size: 256
      learning_rate: 0.001
      patience: 8
    tune:
      enabled: false
      n_trials: 20

  cnn_autoencoder:
    enabled: v
    family: autoencoder
    edge_candidate: true
    export_tflite: true
    priority: experimental
    params:
      filters: [32, 64, 128]
      kernels: [7, 5, 3]
      bottleneck_filters: 32
      dropout: 0.10
      epochs: 40
      batch_size: 256
      learning_rate: 0.001
      patience: 8
    tune:
      enabled: false
      n_trials: 20

  # Preset baseado no melhor modelo completo visto nas rodadas externas:
  # optuna_tiny_cnn_classifier_v4.
  tiny_cnn:
    enabled: true
    family: neural_classifier
    edge_candidate: true
    export_tflite: true
    priority: main_candidate
    params:
      n_blocks: 3
      base_filters: 16
      kernel_first: 21
      kernel_other: 5
      dense_units: 48
      dropout: 0.240293
      spatial_dropout: 0.007913
      learning_rate: 0.0027376
      l2_reg: 0.000008261
      use_batch_norm: false
      conv_type: conv
      head_pooling: avgmax
      label_smoothing: 0.008688
      pos_multiplier: 1.0
      epochs: 20
      batch_size: 128
      patience: 5
    tune:
      enabled: false
      n_trials: 60
      epochs_per_trial: 80
      patience_per_trial: 8
      max_params: 20000
      search_space:
        base_filters:
          type: categorical
          choices: [8, 12, 16, 24, 32]
        n_blocks:
          type: int
          low: 2
          high: 5
        kernel_first:
          type: categorical
          choices: [7, 11, 15, 21]
        kernel_other:
          type: categorical
          choices: [3, 5, 7]
        dense_units:
          type: categorical
          choices: [0, 16, 32, 48, 64]
        dropout:
          type: float
          low: 0.0
          high: 0.45
        spatial_dropout:
          type: float
          low: 0.0
          high: 0.30
        learning_rate:
          type: float
          low: 0.0001
          high: 0.005
          log: true
        l2_reg:
          type: float
          low: 0.0000001
          high: 0.001
          log: true
        pos_multiplier:
          type: float
          low: 0.70
          high: 2.00
        label_smoothing:
          type: float
          low: 0.0
          high: 0.05
        batch_size:
          type: categorical
          choices: [128, 256, 512]
        head_pooling:
          type: categorical
          choices: [avg, max, avgmax]
        conv_type:
          type: categorical
          choices: [conv, separable]
        use_batch_norm:
          type: categorical
          choices: [true, false]

  # Preset baseado no melhor parcial do optuna_tiny_tcn_classifier_v4-2.
  # Deve ser reavaliado quando a rodada terminar e gerar resultado final de teste.
  tiny_tcn:
    enabled: false
    family: neural_classifier
    edge_candidate: true
    export_tflite: true
    priority: candidate
    params:
      batch_size: 128
      pos_multiplier: 0.8275208695255354
      filters: 32
      kernel_size: 7
      n_blocks: 6
      dilation_base: 3
      dropout: 0.028423185415906306
      spatial_dropout: 0.06635884588558189
      dense_units: 24
      learning_rate: 0.0005809816939134014
      l2_reg: 0.000015141953225930909
      head_pooling: avg
      label_smoothing: 0.030519884747161094
      padding: same
      conv_type: separable
      use_batch_norm: false
      epochs: 100
      patience: 12

    tune:
      enabled: false
      n_trials: 60
      epochs_per_trial: 80
      patience_per_trial: 8
      max_params: 20000
      search_space:
        filters:
          type: categorical
          choices: [8, 12, 16, 24, 32]
        kernel_size:
          type: categorical
          choices: [3, 5, 7, 9, 11]
        n_blocks:
          type: int
          low: 3
          high: 6
        dilation_base:
          type: categorical
          choices: [2, 3]
        dropout:
          type: float
          low: 0.0
          high: 0.45
        spatial_dropout:
          type: float
          low: 0.0
          high: 0.30
        dense_units:
          type: categorical
          choices: [0, 8, 16, 24, 32, 48]
        learning_rate:
          type: float
          low: 0.0001
          high: 0.005
          log: true
        l2_reg:
          type: float
          low: 0.0000001
          high: 0.001
          log: true
        pos_multiplier:
          type: float
          low: 0.70
          high: 2.00
        label_smoothing:
          type: float
          low: 0.0
          high: 0.05
        batch_size:
          type: categorical
          choices: [128, 256, 512, 1024]
        head_pooling:
          type: categorical
          choices: [avg, max, avgmax]
        conv_type:
          type: categorical
          choices: [conv, separable]
        padding:
          type: categorical
          choices: [same]
        use_batch_norm:
          type: categorical
          choices: [true, false]

  lstm_classifier:
    enabled: false
    family: neural_classifier
    edge_candidate: false
    export_tflite: false
    priority: experimental
    params:
      units: 48
      dense_units: 24
      dropout: 0.20
      epochs: 40
      batch_size: 256
      learning_rate: 0.001
      patience: 8
    tune:
      enabled: false
      n_trials: 20
