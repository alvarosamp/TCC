  tiny_tcn:
    enabled: true
    family: neural_classifier
    deployment_target: edge
    selection_group: edge
    edge_candidate: true
    export_tflite: true
    priority: main_edge_candidate
    params:
      batch_size: 128
      pos_multiplier: 0.8275208695255354
      filters: 32
      kernel_size: 7
      n_blocks: 6
      dilation_base: 3
      dropout: 0.028423185415906306
      spatial_dropout: 0.06635884588558189
      dense_units: 24
      learning_rate: 0.0005809816939134014
      l2_reg: 0.000015141953225930909
      head_pooling: avg
      label_smoothing: 0.030519884747161094
      padding: same
      conv_type: separable
      use_batch_norm: false
      epochs: 100
      patience: 12
    tune:
      enabled: false
      n_trials: 60
      epochs_per_trial: 80
      patience_per_trial: 8
      max_params: 20000
      search_space:
        filters:
          type: categorical
          choices: [8, 12, 16, 24, 32]
        kernel_size:
          type: categorical
          choices: [3, 5, 7, 9, 11]
        n_blocks:
          type: int
          low: 3
          high: 6
        dilation_base:
