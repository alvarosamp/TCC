# Catalogo de modelos do pipeline generico.
#
# Ideia desta versao:
# - manter compatibilidade com a selecao antiga: selection.metric/split/mode;
# - preparar a selecao por objetivo: best_overall, best_edge, best_interpretable;
# - separar modelos de baseline, modelos interpretaveis, modelos edge e modelos experimentais;
# - permitir que datasets como IMS Bearing usem estrategias diferentes de TinyML.
#
# Campos principais:
#
# enabled:
#   true  -> entra no pipeline de treino
#   false -> fica documentado, mas nao roda por padrao
#
# family:
#   classical_supervised   -> modelos supervisionados com features tabulares
#   classical_unsupervised -> modelos nao supervisionados/anomalia
#   neural_classifier      -> redes neurais classificadoras
#   autoencoder            -> modelos por reconstrucao
#
# deployment_target:
#   server      -> modelo voltado a melhor desempenho geral, sem restricao TinyML
#   edge        -> modelo candidato a ESP32/TFLite Micro
#   baseline    -> modelo de comparacao simples
#   experimental -> modelo mantido para estudo, nao necessariamente candidato final
#
# selection_group:
#   overall       -> concorre a melhor modelo geral
#   edge          -> concorre a melhor modelo embarcado
#   interpretable -> concorre a melhor modelo interpretavel
#   experimental  -> fica como experimento
#
# edge_candidate:
#   true  -> pode ser considerado para TinyML/ESP32
#   false -> nao entra como candidato embarcado
#
# export_tflite:
#   true  -> pode ser exportado para TFLite/TFLite Micro, se for Keras
#   false -> nao exporta para TFLite

selection:
  # Campos antigos, mantidos para compatibilidade com o train_all.py atual.
  metric: auc_pr
  split: test
  mode: maximize

  # Nova ideia para a branch.
  # O codigo atual ainda precisa ser ajustado para usar este bloco.
  groups:
    best_overall:
      enabled: true
      metric: auc_pr
      split: test
      mode: maximize
      constraints: {}

    best_edge:
      enabled: true
      metric: auc_pr
      split: test
      mode: maximize
      constraints:
        edge_candidate: true
        export_tflite: true
        max_params: 20000

    best_interpretable:
      enabled: true
      metric: auc_pr
      split: test
      mode: maximize
      constraints:
        families:
          - classical_supervised

models:
  logistic_regression:
    enabled: true
    family: classical_supervised
    deployment_target: baseline
    selection_group: interpretable
    edge_candidate: false
    export_tflite: false
    priority: baseline_light
    params:
      class_weight: balanced
      max_iter: 2000
      C: 1.0
    tune:
      enabled: false
      n_trials: 20
      search_space:
        C:
          type: float
          low: 0.001
          high: 10.0
          log: true

  random_forest:
    enabled: true
    family: classical_supervised
    deployment_target: server
    selection_group: interpretable
    edge_candidate: false
    export_tflite: false
    priority: interpretable_baseline
    params:
      n_estimators: 300
      max_depth: null
      min_samples_split: 2
      min_samples_leaf: 1
      class_weight: balanced
      n_jobs: -1
    tune:
      enabled: false
      n_trials: 30
      search_space:
        n_estimators:
          type: int
          low: 150
          high: 600
        max_depth:
          type: categorical
          choices: [null, 8, 12, 16, 24, 32]
        min_samples_leaf:
          type: int
          low: 1
          high: 5

  extra_trees:
    enabled: true
    family: classical_supervised
    deployment_target: server
    selection_group: interpretable
    edge_candidate: false
    export_tflite: false
    priority: interpretable_baseline
    params:
      n_estimators: 300
      max_depth: null
      min_samples_split: 2
      min_samples_leaf: 1
      class_weight: balanced
      n_jobs: -1
    tune:
      enabled: false
      n_trials: 30
      search_space:
        n_estimators:
          type: int
          low: 150
          high: 600
        max_depth:
          type: categorical
          choices: [null, 8, 12, 16, 24, 32]
        min_samples_leaf:
          type: int
          low: 1
          high: 5

  isolation_forest:
    enabled: false
    family: classical_unsupervised
    deployment_target: baseline
    selection_group: experimental
    edge_candidate: false
    export_tflite: false
    priority: anomaly_baseline
    params:
      n_estimators: 300
      contamination: 0.05
      n_jobs: -1
    tune:
      enabled: false
      n_trials: 20
      search_space:
        n_estimators:
          type: int
          low: 150
          high: 600
        contamination:
          type: float
          low: 0.01
          high: 0.20
          log: false

  dense_autoencoder:
    enabled: false
    family: autoencoder
    deployment_target: experimental
    selection_group: experimental
    edge_candidate: true
    export_tflite: true
    priority: experimental
    params:
      hidden_units: [256, 128]
      latent_dim: 32
      dropout: 0.10
      epochs: 40
      batch_size: 256
      learning_rate: 0.001
      patience: 8
    tune:
      enabled: false
      n_trials: 20

  cnn_autoencoder:
    enabled: false
    family: autoencoder
    deployment_target: experimental
    selection_group: experimental
    edge_candidate: true
    export_tflite: true
    priority: experimental
    params:
      filters: [32, 64, 128]
      kernels: [7, 5, 3]
      bottleneck_filters: 32
      dropout: 0.10
      epochs: 40
      batch_size: 256
      learning_rate: 0.001
      patience: 8
    tune:
      enabled: false
      n_trials: 20

  tiny_cnn:
    enabled: true
    family: neural_classifier
    deployment_target: edge
    selection_group: edge
    edge_candidate: true
    export_tflite: true
    priority: edge_candidate
    params:
      n_blocks: 3
      base_filters: 16
      kernel_first: 21
      kernel_other: 5
      dense_units: 48
      dropout: 0.240293
      spatial_dropout: 0.007913
      learning_rate: 0.0027376
      l2_reg: 0.000008261
      use_batch_norm: false
      conv_type: conv
      head_pooling: avg
      label_smoothing: 0.008688
      pos_multiplier: 1.0
      epochs: 20
      batch_size: 128
      patience: 5
    tune:
      enabled: false
      n_trials: 60
      epochs_per_trial: 80
      patience_per_trial: 8
      max_params: 20000
      search_space:
        base_filters:
          type: categorical
          choices: [8, 12, 16, 24, 32]
        n_blocks:
          type: int
          low: 2
          high: 5
        kernel_first:
          type: categorical
          choices: [7, 11, 15, 21]
        kernel_other:
          type: categorical
          choices: [3, 5, 7]
        dense_units:
          type: categorical
          choices: [0, 16, 32, 48, 64]
        dropout:
          type: float
          low: 0.0
