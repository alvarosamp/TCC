        pos_multiplier:
          type: float
          low: 0.70
          high: 2.00
        label_smoothing:
          type: float
          low: 0.0
          high: 0.05
        batch_size:
          type: categorical
          choices: [128, 256, 512, 1024]
        head_pooling:
          type: categorical
