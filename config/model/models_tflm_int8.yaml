selection:
  metric: auc_pr
  split: test
  mode: maximize
  groups:
    best_overall:
      enabled: true
      metric: auc_pr
      split: test
      mode: maximize
      constraints: {}
    best_edge:
      enabled: true
      metric: auc_pr
      split: test
      mode: maximize
      constraints:
        edge_candidate: true
        export_tflite: true
        max_params: 20000
    best_interpretable:
      enabled: true
      metric: auc_pr
      split: test
      mode: maximize
      constraints:
        families:
        - classical_supervised
models:
  logistic_regression:
    enabled: false
    family: classical_supervised
    deployment_target: baseline
    selection_group: interpretable
    edge_candidate: false
    export_tflite: false
    priority: baseline_light
    params:
      class_weight: balanced
      max_iter: 2000
      C: 1.0
    tune:
      enabled: false
      n_trials: 20
      search_space:
        C:
          type: float
          low: 0.001
          high: 10.0
          log: true
  random_forest:
