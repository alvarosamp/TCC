#Configuração global
project:
  name: "TCC"
  version: "0.1.0"
  seed: 42

#Profile ativo ( trocar o valor permite rodar o mesmo pipeline em outro dominio)
profile:
  name: seismic_edge_v1
  path: config/configs/profiles/seismic_edge_v1.yaml


#Caminhos principais
paths:
  data_base: "data/"
  raw_dir: "data/raw/"
  processed_dir: "data/processed/"
  artefacts_dir: "artefacts/"
  reports_dir: "reports/"
  models_dir: "models/"
  edge_dir: "edge/"
  runs_dir: "runs/"

#Mlflow (collab da pra usar um file tracking)
mlflow:
  experiment_name: tcc_tinyml_timeseries
  tracking_uri: sqlite:///artefacts/mlruns/mlflow.db

#Dataset principal
dataset:
  split_name: evento
  file_name: dataset_seismic_edge_v1_split_evento.npz

#Politica de presença do modelo
#Um modelo novo so vira novo candidato se tiver uma performance melhor que o modelo atual
quality_gate:
  primary_metric: auc_pr
  min_auc_pr: 0.80
  min_f1: 0.70
  max_fp_per_hour: 10
  max_val_test_auc_pr_gap: 0.08
  max_model_size_kb: 300