# Catalogo de modelos.
#
# enabled:
#   true  -> entra no pipeline
#   false -> ignorado
#
# tune.enabled:
#   true  -> roda Optuna antes do treino final
#   false -> usa params fixos
#
# edge_candidate:
#   true  -> pode virar candidato TinyML/ESP32
#   false -> baseline ou comparacao cientifica

selection:
  metric: auc_pr
  split: test
  mode: maximize

models:
  logistic_regression:
    enabled: true
    family: classical_supervised
    edge_candidate: false
    export_tflite: false
    priority: baseline
    params:
      class_weight: balanced
      max_iter: 2000
      C: 1.0
    tune:
      enabled: true
      n_trials: 20
      search_space:
        C:
          type: float
          low: 0.001
          high: 10.0
          log: true

  random_forest:
    enabled: true
    family: classical_supervised
    edge_candidate: false
    export_tflite: false
    priority: baseline
    params:
      n_estimators: 300
      max_depth: null
      min_samples_split: 2
      min_samples_leaf: 1
      class_weight: balanced
      n_jobs: -1
    tune:
      enabled: true
      n_trials: 30
      search_space:
        n_estimators:
          type: int
          low: 150
          high: 600
        max_depth:
          type: categorical
          choices: [null, 8, 12, 16, 24]
        min_samples_leaf:
          type: int
          low: 1
          high: 5

  extra_trees:
    enabled: true
    family: classical_supervised
    edge_candidate: false
    export_tflite: false
    priority: baseline
    params:
      n_estimators: 300
      max_depth: null
      min_samples_split: 2
      min_samples_leaf: 1
      class_weight: balanced
      n_jobs: -1
    tune:
      enabled: true
      n_trials: 30
      search_space:
        n_estimators:
          type: int
          low: 150
          high: 600
        max_depth:
          type: categorical
          choices: [null, 8, 12, 16, 24]
        min_samples_leaf:
          type: int
          low: 1
          high: 5

  isolation_forest:
    enabled: true
    family: classical_unsupervised
    edge_candidate: false
    export_tflite: false
    priority: anomaly_baseline
    params:
      n_estimators: 300
      contamination: 0.05
      n_jobs: -1
    tune:
      enabled: true
      n_trials: 20
      search_space:
        n_estimators:
          type: int
          low: 150
          high: 600
        contamination:
          type: float
          low: 0.01
          high: 0.20
          log: false

  dense_autoencoder:
    enabled: true
    family: autoencoder
    edge_candidate: true
    export_tflite: true
    priority: candidate
    params:
      hidden_units: [256, 128]
      latent_dim: 32
      dropout: 0.10
      epochs: 40
      batch_size: 256
      learning_rate: 0.001
      patience: 8
    tune:
      enabled: false
      n_trials: 20

  cnn_autoencoder:
    enabled: true
    family: autoencoder
    edge_candidate: true
    export_tflite: true
    priority: candidate
    params:
      filters: [32, 64, 128]
      kernels: [7, 5, 3]
      bottleneck_filters: 32
      dropout: 0.10
      epochs: 40
      batch_size: 256
      learning_rate: 0.001
      patience: 8
    tune:
      enabled: false
      n_trials: 20

  tiny_cnn:
    enabled: true
    family: neural_classifier
    edge_candidate: true
    export_tflite: true
    priority: candidate
    params:
      filters: [16, 32, 48]
      kernels: [7, 5, 3]
      dense_units: 24
      dropout: 0.15
      epochs: 40
      batch_size: 256
      learning_rate: 0.001
      patience: 8
    tune:
      enabled: false
      n_trials: 20

  tiny_tcn:
    enabled: true
    family: neural_classifier
    edge_candidate: true
    export_tflite: true
    priority: main_candidate
    params:
      filters: 24
      kernel_size: 5
      dilations: [1, 2, 4, 8]
      dense_units: 24
      dropout: 0.10
      epochs: 40
      batch_size: 256
      learning_rate: 0.001
      patience: 8
    tune:
      enabled: false
      n_trials: 20

  lstm_classifier:
    enabled: false
    family: neural_classifier
    edge_candidate: false
    export_tflite: false
    priority: experimental
    params:
      units: 48
      dense_units: 24
      dropout: 0.20
      epochs: 40
      batch_size: 256
      learning_rate: 0.001
      patience: 8
    tune:
      enabled: false
      n_trials: 20